name: build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Installers bundle a standalone Python interpreter plus MinerU (torch and
# friends), so both jobs take a while and produce ~1.5 GB app directories.
# Model weights are NOT bundled -- the app downloads them on demand.

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-macos-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^1

      - name: Build .app and .dmg
        run: ./packaging/build_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: scribe-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-windows-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^1

      - name: Build payload and installers
        run: ./packaging/build_win.ps1
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: scribe-windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
